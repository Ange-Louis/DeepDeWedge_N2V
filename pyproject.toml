[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "DeepDeWedge_N2V"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.3,<3",
    "pillow>=12.2.0,<13",
    "mrcfile>=1.5.4,<2",
    "typer",
    "typer-cli",
    "typer-config",
    "typer-slim",
    "matplotlib",
    "torchvision",
    "pytorch-lightning",
    "scipy",
    "torch",
    "tensorboard>=2.19.0,<3",
    "setuptools<70"
]

[project.scripts]
ddw = "ddw.app:main"

[dependency-groups]
test = [
    "pytest",
    "pytest-cov"
]

[tool.uv]
package = true

# Configuration spécifique à uv pour télécharger PyTorch avec CUDA 12.1
[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
